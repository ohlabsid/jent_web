name: Deploy Hosting + Notify Discord

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # Values come from the repo's Actions secrets
        # (Settings > Secrets and variables > Actions):
        #   SUPABASE_URL, SUPABASE_ANON_KEY, WEB3FORMS_KEY
        # Passed via env + shell expansion (quoted) so secret values
        # with special characters can't break the command. A missing
        # secret expands to an empty define, which the app treats as
        # "not configured": Supabase is skipped (music falls back to
        # the bundled demo catalog) and the contact form shows its
        # no-key error state.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          flutter build web --release --base-href / \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=WEB3FORMS_KEY="$WEB3FORMS_KEY"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ME_JENT }}
          projectId: jentweb
          channelId: live

      - name: Notify Discord — success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping notification."
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"✅ Hosting deployed — jentweb\",
              \"url\": \"https://jentweb.web.app\",
              \"color\": 5763719,
              \"description\": \"A new version is live on Firebase Hosting.\",
              \"fields\": [
                {\"name\": \"Site\", \"value\": \"https://jentweb.web.app\", \"inline\": false},
                {\"name\": \"Commit\", \"value\": \"${GITHUB_SHA::7} by ${GITHUB_ACTOR}\", \"inline\": true},
                {\"name\": \"Branch\", \"value\": \"${GITHUB_REF_NAME}\", \"inline\": true},
                {\"name\": \"Console\", \"value\": \"https://console.firebase.google.com/u/1/project/jentweb/hosting/sites/jentweb\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord — failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping notification."
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"❌ Hosting deploy FAILED — jentweb\",
              \"url\": \"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",
              \"color\": 15548997,
              \"description\": \"The build or deploy step failed. Check the Actions run.\",
              \"fields\": [
                {\"name\": \"Commit\", \"value\": \"${GITHUB_SHA::7} by ${GITHUB_ACTOR}\", \"inline\": true},
                {\"name\": \"Branch\", \"value\": \"${GITHUB_REF_NAME}\", \"inline\": true},
                {\"name\": \"Run\", \"value\": \"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$DISCORD_WEBHOOK_URL"
