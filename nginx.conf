# nginx config for the jent_web container (Dokploy / any Docker host).
# Serves the static Flutter web bundle produced by `flutter build web`
# and baked in by the Dockerfile. Replaces firebase.json — the SPA
# rewrite below mirrors its `** -> /index.html` rule so go_router
# deep links work on hard refresh.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Everything revalidates (ETag/Last-Modified -> cheap 304s).
    # NO long-lived caching anywhere: Flutter's output filenames are
    # not content-hashed (main.dart.js keeps its name across builds),
    # so `immutable` headers would pin visitors to a stale bundle.
    # The service worker itself caches repeat visits in Cache Storage.
    add_header Cache-Control "no-cache" always;

    # Replicates the firebase.json rewrite: unknown paths fall back
    # to index.html so the router can handle them client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # main.dart.js is several MB — gzip it (and the wasm renderer).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm
                application/json text/css image/svg+xml;
}
