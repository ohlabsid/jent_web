<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jent_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/ic_logo_transparent.png"/>

  <title>jent_web</title>
  <link rel="manifest" href="manifest.json">

</head>
<body>
  <script>
    window.SpotifyPlayerLoaded = false;
    window.onSpotifyWebPlaybackSDKReady = function () {
      window.SpotifyPlayerLoaded = true;
    };
  </script>
  <script src="https://sdk.scdn.co/spotify-player.js" async></script>
  <!-- hCaptcha for Web3Forms spam protection. `render=explicit` keeps the
       script from auto-mounting so the Flutter web client can call
       window.hcaptcha.render() into its own platform view. -->
  <script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
